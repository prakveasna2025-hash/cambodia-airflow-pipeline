cambodia_dw:
  target: ci
  outputs:
    ci:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5434') | int }}"
      user: "{{ env_var('DBT_USER', 'airflow') }}"
      password: "{{ env_var('DBT_PASSWORD', 'changeme') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'airflow') }}"
      schema: dbt_dev
      threads: 4